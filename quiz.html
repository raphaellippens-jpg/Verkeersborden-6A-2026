<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz · Mijn Verkeersborden Test</title><link rel="stylesheet" href="../style.css"></head><body><nav><div class="navin" data-nav></div></nav><main><div class="hero" style="padding:35px 0"><div class="eyebrow">Exacte toetsmodus</div><h1>🎯 Quiz</h1><p>Schrijf de betekenis zo exact mogelijk. Punten tellen alleen wanneer de formulering overeenkomt.</p></div>
<div class="progress"><i id="bar"></i></div><div class="section" id="quiz"></div></main><footer class="footer" data-footer></footer><script src="../app.js"></script><script src="../signs.js"></script><script>
let pool=[...SIGNS].sort(()=>Math.random()-.5),i=0,score=0;
const norm=s=>s.trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){if(i>=pool.length){quiz.innerHTML=`<h2>🎉 Klaar!</h2><p>Score: <b>${score}/${pool.length}</b></p><button class="btn primary" onclick="restart()">Opnieuw</button>`;bar.style.width='100%';return}
bar.style.width=(i/pool.length*100)+'%';let x=pool[i];quiz.innerHTML=`<span class="tag">${esc(x.section)} · ${esc(x.key)}</span><h2>Wat is de exacte betekenis?</h2><input id="ans" autofocus><div class="actions"><button class="btn primary" onclick="check()">Controleer</button></div><div id="feedback"></div>`;ans.onkeydown=e=>{if(e.key==='Enter')check()}}
function check(){let x=pool[i],ok=norm(ans.value)===norm(x.text);if(ok)score++;feedback.innerHTML=ok?`<p class="good"><b>✅ Juist!</b></p>`:`<p class="bad"><b>❌ Niet exact.</b></p><p><b>Juist antwoord:</b><br>${esc(x.text)}</p>`;feedback.innerHTML+=`<button class="btn" onclick="i++;render()">Volgende →</button>`}
localStorage.setItem('quizAttempts',String(Number(localStorage.getItem('quizAttempts')||0)+1));localStorage.setItem('quizBest',String(Math.max(Number(localStorage.getItem('quizBest')||0),Math.round(score/pool.length*100))));}function restart(){pool=[...SIGNS].sort(()=>Math.random()-.5);i=0;score=0;render()}render();
</script></body></html>
